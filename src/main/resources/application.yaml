server:
  port: 8088

spring:
  application:
    name: my-mcp-server

  shutdown:
    graceful: true

  lifecycle:
    timeout-per-shutdown-phase: 3s

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dawn?serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: 123456

  mybatis-plus:
    mapper-locations: classpath:mapper/*.xml
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
      map-underscore-to-camel-case: true

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    mcp:
      server:
        name: my-mcp-server
        version: 1.0.0
        type: SYNC
        instructions: "This server provides sql information tools and resources"
        sse-message-endpoint: /mcp/messages
        sse-endpoint: /sse
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: true

logging:
  level:
    root: INFO
    io.modelcontextprotocol: DEBUG
    org.springframework.ai: DEBUG
    com.dododo.mymcpserver: DEBUG
# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.dododo.mymcpserver.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
